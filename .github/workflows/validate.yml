name: Validate Swirl

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  launcher:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  in-game-module:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        minecraft-version: ["26.1.2", "26.2"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
      - name: Build module for Minecraft ${{ matrix.minecraft-version }}
        env:
          ORG_GRADLE_PROJECT_minecraftVersion: ${{ matrix.minecraft-version }}
        run: gradle -p swirl-mod clean bundleMod
