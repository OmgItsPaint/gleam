plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

def supportedTargets = ['26.1.2', '26.2']
def targetMinecraft = providers.gradleProperty('minecraftVersion').getOrElse('26.2').toString().trim()
if (!supportedTargets.contains(targetMinecraft)) {
    throw new GradleException("Unsupported Minecraft version '${targetMinecraft}'. Expected 26.1.2 or 26.2.")
}
def apiVersion = targetMinecraft == '26.1.2' ? fabric_api_26_1_2 : fabric_api_26_2

version = "${mod_version}+${targetMinecraft}"
group = maven_group

repositories {
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    minecraft "com.mojang:minecraft:${targetMinecraft}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_version', targetMinecraft
    filesMatching('fabric.mod.json') {
        expand version: project.version, minecraft_version: targetMinecraft
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}

base {
    archivesName = "swirl-client-${targetMinecraft}"
}

tasks.register('bundleMod', Copy) {
    dependsOn tasks.named('jar')
    from tasks.named('jar').flatMap { it.archiveFile }
    into layout.projectDirectory.dir('../bundled-mods')
    rename { "swirl-client-${targetMinecraft}.jar" }
}
